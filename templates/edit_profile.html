
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - Farmer Market</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-success navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            🌱 Farmer Market
        </a>

        <a href="{% url 'customer_profile' %}" class="btn btn-light">
            ← Back to Profile
        </a>
    </div>
</nav>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-success text-white text-center py-3">
                    <h3 class="mb-0">✏️ Edit My Profile</h3>
                </div>

                <div class="card-body p-4">

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Full Name
                            </label>
                            <input type="text"
                                   id="name"
                                   name="name"
                                   class="form-control"
                                   value="{{ consumer.name }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">
                                Phone Number
                            </label>
                            <input type="tel"
                                   id="phone"
                                   name="phone"
                                   class="form-control"
                                   value="{{ consumer.phone }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="city" class="form-label">
                                City
                            </label>
                            <input type="text"
                                   id="city"
                                   name="city"
                                   class="form-control"
                                   value="{{ consumer.city }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">
                                Address
                            </label>
                            <textarea id="address"
                                      name="address"
                                      class="form-control"
                                      rows="3"
                                      required>{{ consumer.address }}</textarea>
                        </div>

                        <button type="submit"
                                class="btn btn-success w-100">
                            💾 Save Changes
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
