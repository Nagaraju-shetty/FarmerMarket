
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Payment - Farmer Market</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 500px;">
        <div class="card-body text-center p-4">
            <h2 class="text-success">🌱 Farmer Market</h2>
            <h4 class="mt-4">Complete Your Payment</h4>

            <p class="text-muted">Order #{{ order.id }}</p>

            <h3 class="text-success mb-4">
                ₹{{ order.total_amount }}
            </h3>

            <p>Pay securely using Razorpay Test Mode.</p>

            <button id="pay-button" class="btn btn-success btn-lg w-100">
                Pay ₹{{ order.total_amount }}
            </button>

            <p class="text-muted small mt-3">
                This is a test payment. No real money should be transferred.
            </p>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    const options = {
        key: "{{ razorpay_key_id|escapejs }}",
        amount: "{{ razorpay_amount }}",
        currency: "INR",
        name: "Farmer Market",
        description: "Order #{{ order.id }}",
        order_id: "{{ razorpay_order_id|escapejs }}",

        handler: function (response) {
            const form = document.createElement("form");
            form.method = "POST";
            form.action = "{% url 'verify_razorpay_payment' %}";

            const csrf = document.querySelector(
                'input[name="csrfmiddlewaretoken"]'
            );

            const csrfInput = document.createElement("input");
            csrfInput.type = "hidden";
            csrfInput.name = "csrfmiddlewaretoken";
            csrfInput.value = csrf ? csrf.value : "";

            form.appendChild(csrfInput);

            for (const field in response) {
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = field;
                input.value = response[field];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
        },

        theme: {
            color: "#198754"
        }
    };

    document.getElementById("pay-button").onclick = function (event) {
        event.preventDefault();
        const checkout = new Razorpay(options);
        checkout.open();
    };
</script>

<form style="display:none;">
    {% csrf_token %}
</form>

</body>
</html>
