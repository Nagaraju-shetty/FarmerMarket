
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Farmer Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">✏️ Edit Product</h3>
        </div>

        <div class="card-body">

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-control"
                           value="{{ product.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control"
                              rows="3" required>{{ product.description }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-select" required>
                        {% for category in categories %}
                            <option value="{{ category.id }}"
                                {% if category.id == product.category_id %}selected{% endif %}>
                                {{ category.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Price (₹)</label>
                    <input type="number" name="price" class="form-control"
                           value="{{ product.price }}" min="0.01"
                           step="0.01" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Available Quantity</label>
                    <input type="number" name="quantity" class="form-control"
                           value="{{ product.quantity }}" min="0" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Product Image (optional)</label>

                    {% if product.image %}
                        <div class="mb-2">
                            <img src="{{ product.image.url }}"
                                 alt="{{ product.name }}"
                                 style="max-width: 180px; max-height: 150px;">
                        </div>
                    {% endif %}

                    <input type="file" name="image" class="form-control"
                           accept="image/*">
                    <small class="text-muted">
                        Leave empty to keep the existing image.
                    </small>
                </div>

                <button type="submit" class="btn btn-success">
                    Save Changes
                </button>

                <a href="{% url 'farmer_products' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>

        </div>
    </div>
</div>

</body>
</html>
